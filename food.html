<!DOCTYPE html>
<html>
<head>
    <title>Online Food Ordering System</title>
</head>

<body>

    <h1 align="center">Online Food Ordering System</h1>
    <h2 align="center">Welcome to Food Corner</h2>

    <hr>

    <h2>Our Food Menu</h2>

    <table border="1" cellpadding="10" align="center>
        <table border="1" cellpadding="10" align="center">

    <tr>
        <th>Food Image</th>
        <th>Food Name</th>
        <th>Price</th>
        <th>Order</th>
    </tr>

    <tr>
        <td><img src="images/pizza.jpg" width="100" height="80" alt="Pizza"></td>
        <td>Pizza</td>
        <td>₹199</td>
        <td><button onclick="alert('Pizza Added!')">Order Now</button></td>
    </tr>

    <tr>
        <td><img src="images/burger.jpg" width="100" height="80" alt="Burger"></td>
        <td>Burger</td>
        <td>₹99</td>
        <td><button onclick="alert('Burger Added!')">Order Now</button></td>
    </tr>

    <tr>
        <td><img src="images/biryani.jpg" width="100" height="80" alt="Biryani"></td>
        <td>Biryani</td>
        <td>₹150</td>
        <td><button onclick="alert('Biryani Added!')">Order Now</button></td>
    </tr>

    <tr>
        <td><img src="images/momos.jpg" width="100" height="80" alt="Momos"></td>
        <td>Momos</td>
        <td>₹80</td>
        <td><button onclick="alert('Momos Added!')">Order Now</button></td>
    </tr>

</table>

    <hr>

    <h2 align="center">Customer Details</h2>

    <form align="center" onsubmit="alert('Your Order Placed Successfully!'); return false;">

        Name:
        <input type="text" placeholder="Enter your name" required>
        <br><br>

        Mobile Number:
        <input type="tel" placeholder="Enter mobile number" required>
        <br><br>

        Address:
        <textarea placeholder="Enter your address" required></textarea>
        <br><br>

        Select Food:
        <select required>
            <option value="">Choose Food</option>
            <option>Pizza</option>
            <option>Burger</option>
            <option>Biryani</option>
            <option>Momos</option>
        </select>
        <br><br>

        Quantity:
        <input type="number" min="1" value="1" required>
        <br><br>

        <button type="submit">Place Order</button>

    </form>

    <hr>

    <h3 align="center">Thank You! Visit Again.</h3>

</body>
</html>
